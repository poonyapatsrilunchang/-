
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ขอโทษนะคนอ้วน100โล 💗</title>
<style>
body {
  background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: sans-serif;
  overflow: hidden;
  text-align: center;
}

.box {
  background: white;
  padding: 40px;
  border-radius: 30px;
  box-shadow: 0 10px 30px #ff69b466;
  animation: pop 1s infinite alternate;
}

h1 {
  color: #ff4f87;
}

p {
  color: #ff7096;
  font-size: 22px;
}

button {
  background: #ff69b4;
  color: white;
  border: none;
  padding: 15px 30px;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
}

.heart {
  position: absolute;
  color: white;
  animation: float 4s linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

@keyframes pop {
  from { transform: scale(1); }
  to { transform: scale(1.04); }
}
</style>
</head>
<body>

<div class="box">
  <h1>🥺 ขอโทษนะ 💗</h1>
  <p>ดีกันนะ 💕</p>
  <p>เค้ารักเทอที่สุดเลย</p>
  <p>อย่าโกรธเค้าเลยนะ เทอเป็นเมน 🥹</p>
  <button onclick="alert('เย้! เทอกดเเล้วดีกันแล้วนะ 💖 รักเทอที่สุดเลย')">
    ให้อภัยเค้านะ 💗
  </button>
</div>

<script>
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 25 + 15 + "px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 4000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
